<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- リセットCSS: ブラウザのデフォルトスタイルをリセット -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css" />
  <!-- Googleフォントのリンク: 必要に応じて追加 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Noto+Sans+JP:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../img/favicon.png">
  <title>Login｜わすれん</title>
</head>

<body class="mylogin">
  <a href="#"><img src="../img/logo.png" alt="わすれん"></a>
  <div class="form-container">
    <form id="login-form" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="login-username" name="name" placeholder="Enter your username" required />

      <label for="password">Password</label>
      <input type="password" id="login-password" name="password" placeholder="Enter your password" required />

      <div class="button-group">
        <button type="submit" class="sign-btn">Sign In</button>
      </div>
    </form>
  </div>

  <script src="../js/login.js"></script>
</body>

</html>
