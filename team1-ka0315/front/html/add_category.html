<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- リセットCSS: ブラウザのデフォルトスタイルをリセット -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css@3.0.2/destyle.css" />
  <link rel="stylesheet" href="../css/add_or_edit.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <!-- Googleフォントの読み込み (オプション) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="../img/favicon.png">
  <title>Add Category｜わすれん</title>
</head>

<body>
  <div class="container">
    <!-- ナビゲーションタブ -->
    <div class="tabs">
      <a href="category.html"><img src="../img/logo.png" alt="わすれん"></a>
      <a href="category.html" class="tab active">Category</a>
      <a href="checklist.html" class="tab">Checklist</a>
      <a href="item.html" class="tab">Item</a>
    </div>

    <div class="content">
      <div class="category-container">
        <h1>Add category</h1>

        <div class="fill-in-group">
          <label for="name">name</label>
          <input type="text" id="category-name" class="form-input" />
        </div>
      </div>

      <button class="oval-button" id="add-category-btn" type="button">
        <span class="plus-icon">+</span>
        Add Category
      </button>
    </div>
  </div>

  <script src="../js/script.js" defer></script>
  <script src="../js/add_category.js" defer></script>
  <script src="../js/notification.js" defer></script>
